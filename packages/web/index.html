<!-- Keep title and favicon in one line, so the github actions remove them correctly -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <base href="/" />
  <title><%= apTitle %></title>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/logo-180.png">
  <link rel="icon" type="image/x-icon" href="<%= apFavicon %>">
  <link rel="stylesheet" href="/src/styles.css" />
  <!-- Theme init: apply saved theme class synchronously before first paint -->
  <script>
    (function () {
      var stored = localStorage.getItem('vite-ui-theme');
      var theme = stored === 'dark' || stored === 'light' ? stored :
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.classList.add(theme);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
