name: Deploy to Oracle VM

on:
  push:
    branches:
      - feat/content-creator-templates
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web frontend
        run: bun x turbo run build --filter=web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/anticeil:latest
            ghcr.io/${{ github.repository_owner }}/anticeil:${{ github.sha }}

      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          port: ${{ secrets.ORACLE_VM_PORT || 22 }}
          script: |
            set -e
            cd ~/anticeil

            # Pull latest code
            git pull origin ${{ github.ref_name }}

            # Login to GHCR and pull new image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/anticeil:latest

            # Tag as local anticeil:latest
            docker tag ghcr.io/${{ github.repository_owner }}/anticeil:latest anticeil:latest

            # Update AP_FRONTEND_URL to production domain in .env
            sed -i 's|^AP_FRONTEND_URL=.*|AP_FRONTEND_URL=https://anticeil.com|' .env

            # Recreate containers with new image
            docker compose up -d --force-recreate app worker

            # Cleanup old images
            docker image prune -f

            echo "Deployment complete!"
