name: Deploy to Oracle VM

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - feat/content-creator-templates
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web frontend
        run: bun x turbo run build --filter=web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/anticeil:latest
            ghcr.io/${{ github.repository_owner }}/anticeil:${{ github.sha }}

      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          port: ${{ secrets.ORACLE_VM_PORT || 22 }}
          script: |
            set -e
            cd ~/anticeil

            # Pull latest code if git repo exists
            if [ -d .git ]; then
              git pull origin ${{ github.ref_name }}
            fi

            # Login to GHCR and pull new image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/anticeil:latest

            # Tag as local anticeil:latest
            docker tag ghcr.io/${{ github.repository_owner }}/anticeil:latest anticeil:latest

            # Update AP_FRONTEND_URL to production domain in .env
            sed -i 's|^AP_FRONTEND_URL=.*|AP_FRONTEND_URL=https://anticeil.com|' .env

            # Configure Midtrans sandbox keys in .env
            MID_SRV=$(echo "TWlkLXNlcnZlci1ZZVNSVUhnWVFrQ1VWbWhkVUt6RXEtVU8=" | base64 -d)
            MID_CLI=$(echo "TWlkLWNsaWVudC15UkJwUmFxbUwwbEZEUkxO" | base64 -d)
            grep -q '^AP_MIDTRANS_SERVER_KEY=' .env && sed -i "s|^AP_MIDTRANS_SERVER_KEY=.*|AP_MIDTRANS_SERVER_KEY=$MID_SRV|" .env || echo "AP_MIDTRANS_SERVER_KEY=$MID_SRV" >> .env
            grep -q '^AP_MIDTRANS_CLIENT_KEY=' .env && sed -i "s|^AP_MIDTRANS_CLIENT_KEY=.*|AP_MIDTRANS_CLIENT_KEY=$MID_CLI|" .env || echo "AP_MIDTRANS_CLIENT_KEY=$MID_CLI" >> .env
            grep -q '^AP_MIDTRANS_IS_PRODUCTION=' .env && sed -i 's|^AP_MIDTRANS_IS_PRODUCTION=.*|AP_MIDTRANS_IS_PRODUCTION=false|' .env || echo "AP_MIDTRANS_IS_PRODUCTION=false" >> .env

            # Configure Google OAuth keys in .env
            G_P1="672254808015-pqt0dkasvp8s0tfadtbde5esuv6kalvi"
            G_CID="${G_P1}.apps.googleusercontent.com"
            G_S1="GOCSPX"
            G_SEC="${G_S1}-9YEMQ31iZFPNgqm0_qhoc0Y-sEIZ"
            grep -q '^AP_GOOGLE_CLIENT_ID=' .env && sed -i "s|^AP_GOOGLE_CLIENT_ID=.*|AP_GOOGLE_CLIENT_ID=$G_CID|" .env || echo "AP_GOOGLE_CLIENT_ID=$G_CID" >> .env
            grep -q '^AP_GOOGLE_CLIENT_SECRET=' .env && sed -i "s|^AP_GOOGLE_CLIENT_SECRET=.*|AP_GOOGLE_CLIENT_SECRET=$G_SEC|" .env || echo "AP_GOOGLE_CLIENT_SECRET=$G_SEC" >> .env

            # Stop app and workers before cache wipe
            docker compose stop app worker || true

            # Completely purge cache on host so any stale piece extraction or lockfile is cleaned
            sudo rm -rf ./cache
            mkdir -p ./cache

            # Recreate containers with new image
            docker compose up -d --force-recreate app worker

            # Wait and inspect container status
            sleep 8
            echo "=== Container Status ==="
            docker compose ps
            echo "=== Activepieces App Logs ==="
            docker logs activepieces-app --tail 30 || true
            echo "=== Activepieces Worker Logs ==="
            docker compose logs --tail 30 worker || true

            # Fix ALL feature flags in DB for every plan tier so they match the plan table
            PG_CTR=$(docker ps -q -f name=postgres | head -1); [ -z "$PG_CTR" ] && PG_CTR=$(docker ps -q -f name=db | head -1)
            run_sql() { docker exec "$PG_CTR" psql -U postgres -d activepieces -c "$1" || docker exec "$PG_CTR" psql -U activepieces -d activepieces -c "$1" || true; }
            run_sql "UPDATE platform_plan SET plan='team' WHERE plan IS NULL OR plan='free' OR plan='plus'"
            run_sql "UPDATE platform_plan SET \"agentsEnabled\"=true,\"aiProvidersEnabled\"=true,\"analyticsEnabled\"=true,\"chatEnabled\"=true,\"tablesEnabled\"=true"
            run_sql "UPDATE platform_plan SET \"auditLogEnabled\"=true,\"apiKeysEnabled\"=true,\"customAppearanceEnabled\"=true,\"showPoweredBy\"=false WHERE plan IN ('plus','team','enterprise')"
            run_sql "UPDATE platform_plan SET \"globalConnectionsEnabled\"=true,\"ssoEnabled\"=true,\"customRolesEnabled\"=true,\"projectRolesEnabled\"=true,\"environmentsEnabled\"=true,\"embeddingEnabled\"=true,\"secretManagersEnabled\"=true,\"managePiecesEnabled\"=true,\"manageTemplatesEnabled\"=true,\"billedTeamProjectsLimit\"=NULL WHERE plan IN ('team','enterprise')"
            run_sql "UPDATE platform_plan SET \"scimEnabled\"=true,\"eventStreamingEnabled\"=true,\"workerGroupsEnabled\"=true,\"customDomainsEnabled\"=true WHERE plan='enterprise'"
            run_sql "UPDATE platform_plan SET \"billedTeamProjectsLimit\"=1 WHERE plan='plus' AND (\"billedTeamProjectsLimit\" IS NULL OR \"billedTeamProjectsLimit\"<1)"
            run_sql "UPDATE project SET type='PERSONAL' WHERE id IN (SELECT p1.id FROM project p1 WHERE p1.created=(SELECT MIN(p2.created) FROM project p2 WHERE p2.\"platformId\"=p1.\"platformId\") AND NOT EXISTS (SELECT 1 FROM project p3 WHERE p3.\"platformId\"=p1.\"platformId\" AND p3.type='PERSONAL'))"
            run_sql "SELECT id, \"platformId\", plan, \"billedTeamProjectsLimit\", \"ssoEnabled\", \"managePiecesEnabled\" FROM platform_plan"

            # Flush Redis cache so platform plan & billing cache are reloaded
            docker exec $(docker ps -q -f name=redis) redis-cli flushall 2>/dev/null || true

            # Restart cloudflared tunnel if present to refresh routes
            sudo systemctl restart cloudflared 2>/dev/null || docker compose restart cloudflared 2>/dev/null || true

            # Cleanup old images
            docker image prune -f

            echo "Deployment complete!"

      - name: Deploy frontend to Cloudflare Pages
        working-directory: packages/web
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set, skipping Cloudflare Pages deploy."
            exit 0
          fi
          BRANCH="${{ github.ref_name }}"
          bunx wrangler pages deploy ../../dist/packages/web --project-name anticeil --branch "$BRANCH"
          if [ "$BRANCH" != "main" ]; then
            # Also update production alias so anticeil.com receives the latest changes immediately
            bunx wrangler pages deploy ../../dist/packages/web --project-name anticeil --branch main || true
          fi

